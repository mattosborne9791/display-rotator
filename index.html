<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Display</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

.frame-wrap {
  position: fixed; inset: 0;
  opacity: 0;
  transition: opacity 0.8s ease;
  pointer-events: none;
  background: #000;
}
.frame-wrap.active {
  opacity: 1;
  pointer-events: auto;
}

iframe, video {
  width: 100%; height: 100%;
  border: none; display: block;
}
video { object-fit: contain; background: #000; }

/* Progress bar */
.progress-bar {
  position: fixed; bottom: 0; left: 0;
  height: 3px; width: 0%;
  background: rgba(255,255,255,0.4);
  z-index: 1000;
  transition: width linear;
}

/* Label chip */
.label-chip {
  position: fixed; bottom: 10px; right: 14px;
  font-family: system-ui, sans-serif;
  font-size: 11px; font-weight: 600;
  color: rgba(255,255,255,0.4);
  letter-spacing: 0.08em;
  z-index: 1000;
  pointer-events: none;
}
</style>
</head>
<body>

<div class="frame-wrap" id="frame-0">
  <iframe src="https://mattosborne9791.github.io/mouldshop-dashboard/" title="Mouldshop Dashboard"></iframe>
</div>
<div class="frame-wrap" id="frame-1">
  <iframe src="https://mattosborne9791.github.io/nickerson-dashboard/" title="Nickerson Dashboard"></iframe>
</div>
<div class="frame-wrap" id="frame-2">
  <iframe src="https://mattosborne9791.github.io/mouldshop-dashboard/pipeline.html" title="Pipeline Value"></iframe>
</div>
<div class="frame-wrap" id="frame-3">
  <video src="https://mattosborne9791.github.io/Whats-on-the-board/Whats%20on%20the%20board%20claude.mp4"
         muted playsinline preload="auto"></video>
</div>

<div class="progress-bar" id="progress"></div>
<div class="label-chip" id="label"></div>

<script>
// dwell = milliseconds each screen stays up — edit to change
const DASHBOARDS = [
  { id: 'frame-0', label: 'Mouldshop',           dwell: 60000 }, // 60 s
  { id: 'frame-1', label: 'Nickerson PMS',       dwell: 60000 }, // 60 s
  { id: 'frame-2', label: 'Pipeline Value',      dwell: 60000 }, // 60 s
  { id: 'frame-3', label: "What's on the Board", dwell: 10000 }, // 10 s
];

let current = 0;
const progressEl = document.getElementById('progress');
const labelEl    = document.getElementById('label');

function show(index) {
  DASHBOARDS.forEach((d, i) => {
    const el = document.getElementById(d.id);
    el.classList.toggle('active', i === index);

    // Play the video from the start when its turn comes; pause it otherwise
    const video = el.querySelector('video');
    if (video) {
      if (i === index) {
        video.currentTime = 0;
        video.play().catch(() => {});
      } else {
        video.pause();
      }
    }
  });
  labelEl.textContent = DASHBOARDS[index].label;
  const dwell = DASHBOARDS[index].dwell;

  // Animate progress bar
  progressEl.style.transition = 'none';
  progressEl.style.width = '0%';
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      progressEl.style.transition = `width ${dwell}ms linear`;
      progressEl.style.width = '100%';
    });
  });

  setTimeout(next, dwell);
}

function next() {
  current = (current + 1) % DASHBOARDS.length;
  show(current);
}

show(0);
</script>
</body>
</html>
